<html lang="pt-BR">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f2;--card:#fff;--tx:#1c1a12;--mu:#7b7563;--ac:#c9a227;--acd:#8f6f0e;--ink:#1c1500;--bd:#ebe5d1;--soft:#f5f1e4;--pos:#2e7d6b;--neg:#b5473a;

:root[data-theme="dark"]{--bg:#0e0d0a;--card:#181610;--tx:#f4eed9;--mu:#a39b83;--ac:#d9b03a;--acd:#d9b03a;--bd:#2d291b;--soft:#13110c;--pos:#4fb39c;--neg:#e0796a;--a0:#4fb39c;--a1:#7a9bd6;--a2:#e07f98;--a3:#b79af0;--a4:#f0a05c;--a5:#6cb7e0;--a6:#a9c25a;--a7:#d97fb0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior-y:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--tx);font:14.5px/1.5 var(--f);font-variant-numeric:tabular-nums;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#eed57f;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,#eed57f 0%,#d8b43e 55%,#c9a227 100%);color:var(--ink);padding:12px 18px 13px;box-shadow:0 1px 0 rgba(90,65,0,.28),0 8px 22px rgba(120,90,0,.16)}

.brand{display:flex;justify-content:space-between;font:600 10.5px/1 var(--s);letter-spacing:.32em;text-transform:uppercase;opacity:.7;margin-bottom:9px}
.wal{display:flex;align-items:center;gap:12px}

.lbl{font-size:12px;opacity:.7;font-weight:500}
.bal{display:flex;align-items:baseline;gap:6px}
.bal b{font:700 36px/1.05 var(--s);letter-spacing:.005em;text-shadow:0 1px 0 rgba(255,255,255,.4)}

.mo{text-align:right}.mo b{display:block;font:700 19px/1.1 var(--s)}.mo span{font-size:11.5px;opacity:.7;font-weight:500}

.bar{height:5px;border-radius:5px;background:rgba(28,21,0,.18);margin-top:12px;overflow:hidden}

.help{font-size:12.5px;color:var(--mu);border-left:2px solid var(--ac);padding:1px 0 1px 12px;margin:0 0 18px}
.help b{color:var(--tx);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:600 13px/1 var(--f);white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mu))}
.chip.on{background:var(--ink);color:#f3d77c;border-color:var(--ink)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 14px 14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:12px;overflow:hidden;box-shadow:0 1px 0 rgba(60,45,0,.03),0 4px 14px rgba(60,45,0,.05)}
.card[style*="--c"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.card .t{flex:1;min-width:0;font-weight:600;font-size:14.5px}.card .t small{display:block;color:var(--mu);font-size:12px;font-weight:500;margin-top:2px}
.btn{border:0;background:linear-gradient(180deg,#ecd272,#c9a227);color:var(--ink);border-radius:999px;padding:11px 16px;font:700 14px/1 var(--f);letter-spacing:.01em;min-width:80px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(120,90,0,.25),0 2px 6px rgba(150,115,0,.22);transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.off{background:var(--soft);color:var(--mu);border:1px solid var(--bd);box-shadow:none}
input,select{-webkit-user-select:text;user-select:text}
.dbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dn{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;line-height:1}
.dl{flex:1;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 14px var(--f);text-transform:capitalize}
.dsum{font-size:12.5px;color:var(--mu);margin:0 0 12px}
.cal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:12px}
.chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cg i{font-style:normal;font-size:11px;color:var(--mu);padding:4px 0}
.cd{border:0;background:none;color:var(--tx);border-radius:10px;padding:5px 0 3px;font:600 13px var(--f);display:flex;flex-direction:column;align-items:center;min-height:44px}
.cd em{font-style:normal;font-size:11px;color:var(--acd);height:13px;line-height:13px}.cd.td span{color:var(--acd);text-decoration:underline}
.cd.sel,.cd.sel em,.cd.sel span{background:var(--ink);color:#f3d77c}.cd.sel{background:var(--ink)}.cd.sel em,.cd.sel span{background:none}
.leg{font-size:11.5px;color:var(--mu);margin-top:6px}
button.badge{border:0;font:inherit;font-size:11px;font-weight:700}
.dow{display:flex;gap:4px;margin-top:6px}.dw{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--mu);font:700 12px var(--f)}.dw.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.opt{display:flex;gap:6px;margin-top:6px}.opt .btn{padding:5px 10px;font-size:11.5px}
.card .sel{margin-top:5px;padding:5px 8px;font-size:12px;border-radius:8px;max-width:100%}
.txt{width:100%;font-weight:600}
.btn.bad{background:transparent;color:var(--neg);border:1.5px solid var(--neg);box-shadow:none}
.btn.g{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:8px 12px;font-size:12.5px;min-width:0;font-weight:600;box-shadow:none}
.badge{background:var(--ink);color:#f3d77c;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;margin-left:8px}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
input,select{font:500 14px var(--f);color:var(--tx);background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input.n{width:84px;text-align:right;font-weight:700}
.add{display:grid;grid-template-columns:1fr 92px;gap:8px;margin:10px 0 22px}.add select,.add .btn{grid-column:1/-1}
h3{margin:28px 0 12px;font:700 14px/1.2 var(--s);letter-spacing:.1em;text-transform:uppercase}
h3::after{content:"";display:block;width:28px;height:2px;background:var(--ac);margin-top:8px;border-radius:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 2px 9px;font:600 11px/1 var(--f);display:flex;flex-direction:column;align-items:center;gap:5px}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button{position:relative}nav button.on{color:var(--tx)}nav button.on::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;background:var(--ac);border-radius:0 0 3px 3px}nav button.on svg{stroke:var(--acd);fill:var(--ac);fill-opacity:.22}
.empty{color:var(--mu);text-align:center;padding:26px 0;font-size:13.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 0 rgba(60,45,0,.03),0 4px 14px rgba(60,45,0,.05)}
.stat:first-child{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between}
.stat b{display:block;font:700 22px/1.2 var(--s);margin-top:4px}
.stat:first-child b{font-size:32px;margin:0}
.stat small{color:var(--mu);font-size:12.5px;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin:8px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10.5px;color:var(--mu);font-weight:500}
.bars i{display:block;width:100%;background:linear-gradient(180deg,#e6c85f,#c9a227);border-radius:5px 5px 2px 2px;min-height:3px}
.ar{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:10px 0}.ar span:first-child{width:128px;font-weight:600}.ar .bar{flex:1;margin:0;background:var(--soft);height:6px}.ar .bar i{background:var(--c)}.ar span:last-child{width:56px;text-align:right;color:var(--mu);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:#f3d77c;padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acd);outline-offset:2px}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
main.fade{animation:f .22s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.prog{flex-basis:100%;border-top:1px solid var(--bd);margin-top:2px;padding-top:4px}
.prog summary{font-size:13px;color:var(--mu);padding:8px 0;cursor:pointer;list-style:none}
.prog summary::-webkit-details-marker{display:none}
.prog summary::after{content:" ▾";color:var(--acd)}
.prog .dow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.prog .dw{width:38px;height:38px;border-radius:50%;padding:0;font:700 13px/1 var(--f);border:1px solid var(--bd);background:var(--soft);color:var(--mu)}
.prog .dw.on{background:var(--ac);color:var(--onac);border-color:transparent}
.prog .wkr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 10px;font-size:13.5px;font-weight:600}
.prog .wkr small{display:block;color:var(--mu);font-size:12px;font-weight:500}
.prog .wkr input{width:72px;height:42px;flex:none}
.prog .opt{display:flex;gap:8px}
.prog .opt .btn{flex:1;min-width:0;padding:11px 12px;font-size:13px}
</style>
</head>
<body>
<header><div class="brand"><span>Mérito</span><span style="opacity:.75">Jader Felipe</span></div><div class="wal"><svg width="42" height="42" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#1c1500"/><circle cx="22" cy="22" r="16" fill="none" stroke="#e6c85f" stroke-opacity=".55" stroke-width="1.6"/><path d="M15.5 15.5h13M22 15.5v13" stroke="#ebd079" stroke-width="3" stroke-linecap="round"/></svg><div><div class="lbl">Saldo disponível</div><div class="bal"><b id="bal">0</b><span>tokens</span></div></div><div class="mo"><b id="pct">0%</b><span>da meta</span></div></div><div class="bar"><i id="goalBar"></i></div><div class="row"><span id="today">Hoje: +0</span><span id="goalTxt"></span></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
var AREAS=[];
var DEF={goal:20000,
actions:[
{id:"a1",n:"Treinar",a:0,p:300},{id:"a2",n:"Dormir 7h ou mais",a:0,p:150},{id:"a3",n:"Alimentação dentro do plano",a:0,p:200},{id:"a4",n:"Beber a meta de água",a:0,p:100},{id:"a11",n:"Refeição livre planejada",a:0,p:50},{id:"a12",n:"Leitura (30 min)",a:3,p:150},
{id:"a5",n:"Bloco de foco (90 min)",a:1,p:300},{id:"a6",n:"Postar conteúdo da marca",a:1,p:250},{id:"a7",n:"Avaliação física concluída",a:1,p:200},
{id:"a8",n:"Tempo de qualidade em família",a:2,p:250},{id:"a9",n:"Tarefa de casa feita",a:2,p:100},{id:"a10",n:"Item do bebê resolvido",a:2,p:200}],
rewards:[{id:"r1",n:"Jantar especial",c:4000},{id:"r2",n:"Dia livre sem culpa",c:6000},{id:"r3",n:"Presente para mim",c:9000}],
v:2,bal0:0,areas:["Treino e saúde","Trabalho e negócio","Casa e família","Desenvolvimento pessoal"],slips:[{id:"s1",n:"Furar a dieta",a:0,p:100},{id:"s2",n:"Faltar ao treino",a:0,p:150},{id:"s3",n:"Noite mal dormida",a:0,p:75},{id:"s4",n:"Adiar tarefa importante",a:1,p:100}],cap:600,log:[]};
var S,tab="resumo",area=-1,tabChanged=false;
try{var raw=localStorage.getItem("tokens_v1");S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(DEF));
fixS();
function dstr(t){var d=new Date(t);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fixS(){
  if(S.v!==2){try{if(!localStorage.getItem("tokens_v1_backup_v1"))localStorage.setItem("tokens_v1_backup_v1",JSON.stringify(S))}catch(e){}}
  if(!S.slips)S.slips=JSON.parse(JSON.stringify(DEF.slips));if(!S.cap)S.cap=DEF.cap;if(!S.areas||!S.areas.length)S.areas=DEF.areas.slice();AREAS=S.areas;
  if(!Array.isArray(S.log))S.log=[];
  if(S.v!==2){S.log.forEach(function(l){if(!l.rd)l.rd=dstr(l.t)});S.bal0=S.bal0||0;S.v=2}
}
function ac(i){return "var(--a"+(i%8)+")"}
function areaOpts(sel){return AREAS.map(function(n,i){return '<option value="'+i+'"'+(i===sel?" selected":"")+'>'+esc(n)+'</option>'}).join("")}
function save(){S.chk=balance();try{var j=JSON.stringify(S);localStorage.setItem("tokens_v1",j);if(localStorage.getItem("tokens_v1")!==j)throw 0}catch(e){toast("Falha ao salvar: exporte um backup agora")}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return "x"+Date.now().toString(36)+Math.floor(Math.random()*1e4)}
var sel=dstr(Date.now()),calOpen=false,cm=sel.slice(0,7),showAll=false;
function rdOf(l){return l.rd||dstr(l.t)}
function fmtD(x){return new Date(x+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
function addD(x,n){var d=new Date(x+"T12:00:00");d.setDate(d.getDate()+n);return dstr(d.getTime())}
function weekStart(x){var d=new Date(x+"T12:00:00");d.setDate(d.getDate()-d.getDay());return dstr(d.getTime())}
function weekCount(id,x){var w0=weekStart(x),w1=addD(w0,6);return S.log.filter(function(l){var r=rdOf(l);return l.k==="e"&&!rvd(l)&&l.id===id&&r>=w0&&r<=w1}).length}
function sched(a,x){if(a.on===false)return false;if(a.wk>0)return weekCount(a.id,x)<a.wk||countOn(x,a.id)>0;var w=new Date(x+"T12:00:00").getDay();return !a.days||!a.days.length||a.days.indexOf(w)>-1}
function countOn(x,id){return S.log.filter(function(l){return l.k==="e"&&!rvd(l)&&l.id===id&&rdOf(l)===x}).length}
function earnedOn(x){return S.log.filter(function(l){return l.k==="e"&&!rvd(l)&&rdOf(l)===x}).reduce(function(s,l){return s+l.d},0)}
function dayState(x){var sc=S.actions.filter(function(a){return !a.wk&&sched(a,x)}),dn=sc.filter(function(a){return countOn(x,a.id)>0}).length,any=earnedOn(x)>0;
  if(sc.length)return dn===sc.length?"full":(any?"part":"pend");return any?"full":"none"}
function dateBar(){var td=dstr(Date.now()),d=new Date(sel+"T12:00:00"),lb=sel===td?"Hoje":sel===addD(td,-1)?"Ontem":sel===addD(td,1)?"Amanhã":"";
  var tx=d.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}),sc=S.actions.filter(function(a){return sched(a,sel)}),dn=sc.filter(function(a){return countOn(sel,a.id)>0}).length;
  var h='<div class="dbar"><button class="dn" data-shift="-1" aria-label="Dia anterior">‹</button><button class="dl" data-cal aria-expanded="'+calOpen+'">'+(lb?lb+" · ":"")+tx+' ▾</button><button class="dn" data-shift="1" aria-label="Próximo dia">›</button></div>';
  if(sel!==td)h+='<button class="btn g" data-gotoday style="margin:0 0 10px">Voltar para hoje</button>';
  h+='<div class="dsum">+'+fmt(earnedOn(sel))+' tokens neste dia · '+dn+' de '+sc.length+' previstas concluídas'+(sel<td?' · registros marcados como retroativos':'')+'</div>';
  return h+(calOpen?calHtml():"")}
function calHtml(){var p=cm.split("-"),y=+p[0],m=+p[1]-1,f=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),td=dstr(Date.now()),sy={full:"●",part:"◐",pend:"○",none:""};
  var h='<div class="cal"><div class="chd"><button class="dn" data-mshift="-1" aria-label="Mês anterior">‹</button><b>'+f.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</b><button class="dn" data-mshift="1" aria-label="Próximo mês">›</button></div><div class="cg">'+["D","S","T","Q","Q","S","S"].map(function(x){return "<i>"+x+"</i>"}).join("");
  for(var i=0;i<f.getDay();i++)h+="<span></span>";
  for(var d=1;d<=n;d++){var x=y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);h+='<button class="cd'+(x===sel?" sel":"")+(x===td?" td":"")+'" data-day="'+x+'" aria-label="Dia '+d+'"><span>'+d+'</span><em>'+sy[dayState(x)]+'</em></button>'}
  return h+'</div><div class="leg">● concluído · ◐ parcial · ○ pendente</div></div>'}
var OP={};

    toast("+"+fmt(a.p)+(sel!==td?" · em "+fmtD(sel):"")+" · salvo")}

  else if(d.cal!==undefined){calOpen=!calOpen}
  else if(d.mshift){var q=cm.split("-"),dm=new Date(+q[0],+q[1]-1+ +d.mshift,1);cm=dm.getFullYear()+"-"+("0"+(dm.getMonth()+1)).slice(-2)}
  else if(d.day){sel=d.day;cm=sel.slice(0,7);calOpen=false}
  else if(d.gotoday!==undefined){sel=dstr(Date.now());cm=sel.slice(0,7)}
  else if(d.showall!==undefined){showAll=!showAll}
  else if(d.undolast){var le=S.log.filter(function(l){return l.k==="e"&&l.id===d.undolast&&!rvd(l)&&rdOf(l)===sel}).pop();if(le&&undoLog(le.u))toast("Desfeito")}
  else if(d.actv){S.actions.forEach(function(a){if(a.id===d.actv)a.on=(a.on===false)})}
  else if(d.once){S.actions.forEach(function(a){if(a.id===d.once)a.once=!a.once})}
  else if(d.dow){var pr=d.dow.split(":"),ix=+pr[1];S.actions.forEach(function(a){if(a.id!==pr[0])return;var ds=(a.days&&a.days.length)?a.days.slice():[0,1,2,3,4,5,6],k=ds.indexOf(ix);if(k>-1)ds.splice(k,1);else ds.push(ix);
    if(!ds.length){toast("Escolha ao menos um dia");return}a.days=ds.length===7?undefined:ds.sort()})}
  else if(d.redeem){var r=S.rewards.filter(function(x){return x.id===d.redeem})[0];if(!r||!r.c)return;var b0=balance();if(b0<r.c){toast("Saldo insuficiente: faltam "+fmt(r.c-b0)+" tokens");return}if(!confirm("Resgatar \""+r.n+"\" por "+fmt(r.c)+" tokens?\n\nSaldo atual: "+fmt(b0)+"\nSaldo depois: "+fmt(b0-r.c)))return;if(balance()<r.c)return;push("r","Resgate: "+r.n,-r.c,r.id);toast("Resgatado: "+r.n)}
  else if(d.undo){if(undoLog(d.undo))toast("Desfeito")}
  else if(d.addarea!==undefined){var nn=document.getElementById("nAr").value.trim();if(!nn)return;S.areas.push(nn)}
  else if(d.delarea!==undefined){var di=+d.delarea;
    if(S.areas.length<=1){toast("Precisa ter ao menos uma área");return}
    if(S.actions.some(function(a){return a.a===di})||S.slips.some(function(x){return x.a===di})){toast("Mude as ações dessa área antes de apagar");return}
    S.areas.splice(di,1);S.actions.forEach(function(a){if(a.a>di)a.a--});S.slips.forEach(function(x){if(x.a>di)x.a--});if(area===di)area=-1;else if(area>di)area--}
  else if(d.slip){slip(d.slip)}
  else if(d.joker!==undefined){joker()}
  else if(d.dels){S.slips=S.slips.filter(function(x){return x.id!==d.dels})}
  else if(d.adds!==undefined){var n3=document.getElementById("nS").value.trim(),p3=+document.getElementById("pS").value;if(!n3||!(p3>0))return;S.slips.push({id:uid(),n:n3,a:+document.getElementById("aS").value,p:p3})}
  else if(d.dela){S.actions=S.actions.filter(function(x){return x.id!==d.dela})}
  else if(d.delr){S.rewards=S.rewards.filter(function(x){return x.id!==d.delr})}
  else if(d.adda!==undefined){var n=document.getElementById("nA").value.trim(),p=+document.getElementById("pA").value;if(!n||!(p>0))return;S.actions.push({id:uid(),n:n,a:+document.getElementById("aA").value,p:p})}
  else if(d.addr!==undefined){var n2=document.getElementById("nR").value.trim(),c=+document.getElementById("pR").value;if(!n2||!(c>0))return;S.rewards.push({id:uid(),n:n2,c:c})}
  else return;
  save();render();
});
document.addEventListener("change",function(e){
  var i=e.target,d=i.dataset,v=Math.max(0,+i.value||0);
  if(d.goal!==undefined)S.goal=v||1;
  else if(d.pts)S.actions.forEach(function(a){if(a.id===d.pts)a.p=v});
  else if(d.cost)S.rewards.forEach(function(r){if(r.id===d.cost)r.c=v});
  else if(d.spts)S.slips.forEach(function(x){if(x.id===d.spts)x.p=v});
  else if(d.cap!==undefined)S.cap=v||1;
  else if(d.wk!==undefined){S.actions.forEach(function(a){if(a.id===d.wk)a.wk=Math.min(7,v)})}
  else if(d.aname!==undefined){var nm=i.value.trim();if(nm)S.areas[+d.aname]=nm}
  else if(d.aarea){S.actions.forEach(function(a){if(a.id===d.aarea)a.a=+i.value})}
  else if(d.sarea){S.slips.forEach(function(x){if(x.id===d.sarea)x.a=+i.value})}
  else return;
  save();render();
});
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.exp!==undefined){
    S.lastBackup=Date.now();save();var b=new Blob([JSON.stringify(Object.assign({app:"merito",exportedAt:new Date().toISOString()},S))],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="tokens-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
  }else if(t.dataset.imp!==undefined){document.getElementById("imp").click()}else if(t.dataset.recov!==undefined){recover()}else if(t.dataset.restprev!==undefined){restprev()}
});
document.addEventListener("change",function(e){
  if(e.target.id!=="imp")return;
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var d;try{d=JSON.parse(r.result)}catch(x){alert("Arquivo inválido: não é um backup do Mérito.");return}
    var er=validate(d);if(er){alert("Backup recusado: "+er+".\nSeus dados atuais não foram alterados.");return}
    var bal=d.log.reduce(function(a,l){return a+l.d},0);
    if(!confirm("Backup com "+d.log.length+" movimentações, "+d.actions.length+" ações e "+d.rewards.length+" recompensas.\nSaldo: "+fmt(bal)+" tokens.\n\nIsto SUBSTITUI os dados atuais. Uma cópia dos atuais fica guardada. Continuar?"))return;
    try{localStorage.setItem("tokens_v1_prev",JSON.stringify(S))}catch(x){alert("Não foi possível guardar a cópia de segurança. Importação cancelada.");return}
    delete d.app;delete d.exportedAt;S=d;fixS();save();render();toast("Backup importado")};
  r.readAsText(f);
});
document.addEventListener("toggle",function(e){var t=e.target;if(t&&t.dataset&&t.dataset.prog)OP[t.dataset.prog]=t.open},true);
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("controllerchange",function(){if(!window.__rl){window.__rl=1;location.reload()}});window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
render();
</script>
